<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School-Helper | Вход</title>
    <link rel="stylesheet" href="src/styles/main.css">
</head>
<body>
    <header class="header">
        <div class="header-logo">
            <div class="header-logo-image"><img src="src/icons/SchoolHelper.png" alt="Logo"></div>
            <h1 class="logo-text">Школьный помощник</h1>
        </div>
    </header>

    <section class="auth-section">
        <h2 class="enter-h2-text">Введите код школы для входа</h2>
        <input class="auth-input" type="text" id="schoolCodeInput" placeholder="Код школы">
        
        <button class="btn-primary" id="loginBtn" style="width: 100%; padding: 14px; font-size: 16px;">Войти</button>
        
        <div class="enter-student">
            <a href="#" id="studentLoginBtn" class="enter-student-link">Войти как ученик →</a>
        </div>
    </section>

    <script src="src/js/index.js"></script>
</body>
</html>
